name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: '${{ secrets.AZURE_CREDENTIALS }}'

      - name: Log in to Azure Container Registry
        run: az acr login --name acrisastudentcglyfzltde77k

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Service A (API)
        run: |
          docker build -t acrisastudentcglyfzltde77k.azurecr.io/isa-api:latest -t acrisastudentcglyfzltde77k.azurecr.io/isa-api:${{ github.sha }} -f IntelligentSalesAssistantAPI/Dockerfile .
          docker push acrisastudentcglyfzltde77k.azurecr.io/isa-api:latest
          docker push acrisastudentcglyfzltde77k.azurecr.io/isa-api:${{ github.sha }}

      - name: Build and push Service B (Content Engine)
        run: |
          docker build -t acrisastudentcglyfzltde77k.azurecr.io/isa-contentengine:latest -t acrisastudentcglyfzltde77k.azurecr.io/isa-contentengine:${{ github.sha }} -f IntelligentSalesAssistant.ContentEngine/Dockerfile .
          docker push acrisastudentcglyfzltde77k.azurecr.io/isa-contentengine:latest
          docker push acrisastudentcglyfzltde77k.azurecr.io/isa-contentengine:${{ github.sha }}

      - name: Deploy Service A to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: acrisastudentcglyfzltde77k
          containerAppName: ca-intelligent-sales-api
          resourceGroup: rg-isa-prod
          imageToDeploy: acrisastudentcglyfzltde77k.azurecr.io/isa-api:${{ github.sha }}

      - name: Deploy Service B to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: acrisastudentcglyfzltde77k
          containerAppName: ca-intelligent-content-engine
          resourceGroup: rg-isa-prod
          imageToDeploy: acrisastudentcglyfzltde77k.azurecr.io/isa-contentengine:${{ github.sha }}