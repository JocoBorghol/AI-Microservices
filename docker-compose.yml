services:
  api:
    container_name: intelligent-sales-assistant-api
    build:
      context: .
      dockerfile: IntelligentSalesAssistantAPI/Dockerfile
    ports:
      - "5267:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ServiceAuth__ApiKey=${ServiceAuth__ApiKey}
      - Jwt__Key=${Jwt__Key}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - AdminPassword=${AdminPassword}
      - SellerPassword=${SellerPassword}
      - Apis__BolagsApi__ApiKey=${Apis__BolagsApi__ApiKey}
      - Apis__Hunter__ApiKey=${Apis__Hunter__ApiKey}
      - Apis__GooglePlaces__ApiKey=${Apis__GooglePlaces__ApiKey}
      - Unsplash__AccessKey=${Unsplash__AccessKey}
      - LlmProxySettings__BaseUrl=${LlmProxySettings__BaseUrl}
      - LlmProxySettings__ApiKey=${LlmProxySettings__ApiKey}
    volumes:
      - api_data:/app/Data
    depends_on:
      - content-engine

  content-engine:
    container_name: intelligent-sales-assistant-content-engine
    build:
      context: .
      dockerfile: IntelligentSalesAssistant.ContentEngine/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ServiceAuth__ApiKey=${ServiceAuth__ApiKey}
      - GeminiSettings__ApiKey=${GeminiSettings__ApiKey}
      - UnsplashSettings__AccessKey=${UnsplashSettings__AccessKey}

volumes:
  api_data: