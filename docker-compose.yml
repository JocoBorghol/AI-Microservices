services:
  api:
    container_name: intelligent-sales-assistant-api
    build:
      context: .
      dockerfile: IntelligentSalesAssistantAPI/Dockerfile
    ports:
      - "5267:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ServiceAuth__ApiKey=${ServiceAuth__ApiKey}
      - Jwt__Key=${Jwt__Key}
      - AdminPassword=${AdminPassword}
      - SellerPassword=${SellerPassword}
    volumes:
      - api_data:/app/Data
    depends_on:
      - content-engine

  content-engine:
    container_name: intelligent-sales-assistant-content-engine
    build:
      context: .
      dockerfile: IntelligentSalesAssistant.ContentEngine/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ServiceAuth__ApiKey=${ServiceAuth__ApiKey}

volumes:
  api_data: